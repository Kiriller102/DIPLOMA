name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: messenger
          POSTGRES_PASSWORD: messenger-local
          POSTGRES_DB: messenger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U messenger -d messenger"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://messenger:messenger-local@localhost:5432/messenger?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - run: test -z "$(gofmt -l services/Database_Service)"
      - run: go test -race ./...
      - run: go vet ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/messenger_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/messenger_web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  crypto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make crypto-test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait
      - run: make e2e
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down
